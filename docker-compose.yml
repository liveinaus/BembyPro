services:
  bemby:
    image: liveinaus/bemby-pro:latest
    restart: unless-stopped
    # Room for a clean stop: the app, then the last cloud-backup upload when one is set up
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    labels:
      # The only container the watchtower service below may touch
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /docker/bemby-data:/app/data
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}    # change this
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme} # change this
      # Forgot the panel password? Set ADMIN_PASSWORD_RESET=1 in .env and restart: login goes
      # back to the two values above and every session is signed out; nothing else changes.
      # Log in, set a new password in Settings, then remove it. It applies once per setting.
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-}
      # Secret used to sign login tokens. Required: set to a long random string,
      # e.g. `openssl rand -hex 32`. Compose refuses to start if it is unset.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random string, e.g. openssl rand -hex 32}
      # Optional: set a timezone, e.g. TZ=Australia/Sydney (defaults to UTC)
      # TZ: ${TZ:-UTC}
      # Second hostname pointing at this same container, which is what lets Mini Apps open
      # in the panel instead of a browser tab (see env.example). Listed here because only
      # the variables named in this block reach the container -- one sitting in .env alone
      # is read by Compose for interpolation and then goes nowhere.
      #
      # Must match the panel's scheme: an http origin cannot be framed by an https panel.
      # Keep it on the panel's domain, and have the reverse proxy pass the Host header
      # through unchanged -- nginx's proxy_pass sends the upstream's name by default, and
      # the container answers on this hostname only when it sees it.
      WEBVIEW_PUBLIC_ORIGIN: ${WEBVIEW_PUBLIC_ORIGIN:-}
      # Reverse proxy hops in front of this container: 1 for nginx/Caddy/Traefik, 2 for
      # Cloudflare in front of one of those. Needed for rate limiting and for the viewer
      # to know it is being served over https.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Optional backup to Cloudflare R2 or any S3-compatible bucket: docs/cloud-backup.md
      # Leave BACKUP_S3_BUCKET empty to keep it off.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # One-click upgrade from Settings → Updates, carried out by the watchtower service below
      # (found by its service name on this file's network). Only Watchtower gets the Docker
      # socket; Bemby holds this token, which can do nothing but ask for its own image to be updated.
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN to a long random string, e.g. openssl rand -hex 32}

  # Pulls Bemby's newer image and recreates the container when "Upgrade now" is pressed in
  # Settings. It does nothing on its own: only its update endpoint is on, scheduled updates are
  # off, and it manages only the labelled bemby container. Its API is not published to the host --
  # Bemby reaches it over this file's network. Remove this service (and the token line above)
  # to upgrade by hand instead.
  watchtower:
    # Maintained fork; the original containrrr/watchtower was archived in December 2025
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      # Manage only containers labelled for it (bemby above), whatever else runs on this host
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN to a long random string, e.g. openssl rand -hex 32}
      # Drop the old image once the new one runs, so upgrades do not fill the disk
      WATCHTOWER_CLEANUP: "true"
      # As long as Bemby's own stop_grace_period, for the last backup upload
      WATCHTOWER_TIMEOUT: 30s

